# Void/glibc arm64 CodeQL appliance target for Lima.
#
# Void does not publish a standard cloud image with Lima guest-agent/cloud-init
# integration. This file is intentionally small and records the desired
# appliance shape; see notes/void-codeql.md for the Mac-side boot/install flow.
# This compatibility profile matches lima/void-codeql-128g.yaml.
#
# Start attempt:
#   limactl start --name=void-codeql ./lima/void-codeql.yaml

---
minimumLimaVersion: 2.0.0

vmType: qemu
nestedVirtualization: true
arch: aarch64
cpus: 8
memory: 128GiB
disk: 1TiB

images:
   - location: https://repo-default.voidlinux.org/live/current/void-live-aarch64-20250202-base.iso
     arch: aarch64
     digest: sha256:29516e4c7085a49c2e288aafe143d402a6bcda7271f711f1559ad0c1b9cc1a79

mounts: []

containerd:
   system: false
   user: false

provision:
   - mode: system
     script: |
        #!/bin/sh
        set -eu
        if command -v xbps-install >/dev/null 2>&1 && [ -f /mnt/lima-cidata/scripts/provision-void-codeql.sh ]; then
          /bin/sh /mnt/lima-cidata/scripts/provision-void-codeql.sh
        else
          printf '%s\n' "Void is not installed/provisionable yet; run provision script after first SSH login." >&2
        fi
