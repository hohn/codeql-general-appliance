# Example public_html site; adapt the URL prefix and directory below.
# Keep directory listings disabled in the server configuration (Debian default).
var.cga-public-html-url = "/~hohn/"
var.cga-public-html-directory = "/home/hohn/public_html/"

$HTTP["url"] =^ var.cga-public-html-url {
    alias.url += ( var.cga-public-html-url => var.cga-public-html-directory )
    index-file.names = ( "index.html", "README.html" )
    server.follow-symlink = "disable"

    $HTTP["request-method"] !~ "^(GET|HEAD)$" {
        url.access-deny = ( "" )
    }

    $HTTP["url"] =~ "/[.](?!agent-notes(?:/|$))" {
        url.access-deny = ( "" )
    }

    $HTTP["url"] =~ "/(?:node_modules|__pycache__|scratch|tmp|cga-(?:prep-)?tmp[^/]*)(?:/|$)" {
        url.access-deny = ( "" )
    }

    $HTTP["url"] =~ "[.](?:md|org)$" {
        mimetype.assign = (
            ".md" => "text/plain; charset=utf-8",
            ".org" => "text/plain; charset=utf-8"
        )
    }
}
