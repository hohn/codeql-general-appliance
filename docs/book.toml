[book]
title = "CGA reference manual"
description = "Detailed workflow, component, and operation reference, assembled in place from canonical READMEs."
# The files under src/ are symlinks to the real component READMEs, so the
# existing READMEs stay the single source of truth and are never copied or
# modified. Editing a README updates the book on the next `mdbook build`.
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
# Use mdBook's built-in MathJax integration. Math in source Markdown uses the
# mdBook delimiters \\( ... \\) and \\[ ... \\], not dollar delimiters.
mathjax-support = true
# Requires mdBook >= 0.5. Shows the current page's headings (h2..h6) nested in
# the left sidebar, giving a multi-level table of contents without splitting
# the symlinked component READMEs. Level 3+ start folded (click to expand).
# This is the default in 0.5; set here explicitly to document the intent.
sidebar-header-nav = true

# The reading guide uses canonical repository paths. These aliases keep its
# links working when existing chapters have shorter book-specific names.
[output.html.redirect]
"README.html" = "overview.html"
"READING-GUIDE.html" = "reading-guide.html"
"INTRODUCTORY-GUIDE.html" = "introductory-guide.html"
"server-commander/README.html" = "../server-commander.html"
"agent-commander-argo/README.html" = "../agent-commander-argo.html"
"mrvacommander/README.html" = "../mrvacommander.html"
