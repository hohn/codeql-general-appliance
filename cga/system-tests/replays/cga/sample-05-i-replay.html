<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cga - captured dashboard replay</title>
<style>
:root {
  --cga-bg: #0f1720;
  --cga-panel: #16212e;
  --cga-panel2: #1d2b3a;
  --cga-line: #2b3d50;
  --cga-fg: #d7e2ee;
  --cga-dim: #8ba0b5;
  --cga-accent: #4aa3ff;
  --cga-ok: #37b24d;
  --cga-bad: #e03131;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: var(--cga-bg);
  color: var(--cga-fg);
  font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

/* header ---------------------------------------------------------------- */
#cga-header {
  margin-bottom: 12px;
}
.cga-header-line {
  display: flex;
  align-items: baseline;
  gap: 16px;
}
.cga-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--cga-accent);
}
.cga-sub {
  color: var(--cga-dim);
}
.cga-clock {
  margin-left: auto;
  color: var(--cga-dim);
}

/* flow row -------------------------------------------------------------- */
#cga-flow {
  display: flex;
  align-items: stretch;
  gap: 8px;
  margin-bottom: 12px;
}
.cga-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cga-libs {
  flex: 0 0 220px;
}
.cga-box {
  flex: 1;
  min-width: 180px;
}
.cga-arrow {
  align-self: center;
  color: var(--cga-dim);
  font-size: 20px;
  user-select: none;
}

/* fragment envelope (shared by all cga* servers, Go and Python) --------- */
.cga-frag {
  background: var(--cga-panel);
  border: 1px solid var(--cga-line);
  border-radius: 6px;
  overflow: hidden;
  height: 100%;
}
.cga-slot.cga-box .cga-frag {
  cursor: pointer;
}
.cga-slot.cga-box .cga-frag:hover {
  border-color: var(--cga-accent);
}
.cga-frag-title {
  background: var(--cga-panel2);
  padding: 6px 10px;
  font-weight: 700;
  border-bottom: 1px solid var(--cga-line);
}
.cga-frag-body {
  padding: 8px 10px;
}

/* tables ---------------------------------------------------------------- */
table.cga-kv,
table.cga-list {
  border-collapse: collapse;
  width: 100%;
}
table.cga-kv th {
  text-align: left;
  color: var(--cga-dim);
  padding-right: 10px;
  font-weight: 400;
  white-space: nowrap;
  vertical-align: top;
}
table.cga-list th {
  text-align: left;
  color: var(--cga-dim);
  border-bottom: 1px solid var(--cga-line);
  padding: 4px 8px;
}
table.cga-list td {
  padding: 3px 8px;
  border-bottom: 1px solid #1a2836;
}

/* requestor status indicator ------------------------------------------- */
.cga-statind {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.cga-state {
  border: 1px solid var(--cga-line);
  border-radius: 3px;
  padding: 1px 6px;
  color: var(--cga-dim);
  font-size: 11px;
}
.cga-state.on {
  background: var(--cga-accent);
  color: #08131f;
  border-color: var(--cga-accent);
  font-weight: 700;
}

/* hovers ---------------------------------------------------------------- */
.cga-hover {
  border-bottom: 1px dotted var(--cga-dim);
  cursor: help;
}

/* detail area ----------------------------------------------------------- */
#cga-detail-bar {
  color: var(--cga-dim);
  border-top: 1px solid var(--cga-line);
  padding: 8px 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}
#cga-detail-which {
  color: var(--cga-accent);
  font-weight: 700;
}
.cga-hint {
  font-size: 11px;
}
#cga-reload {
  margin-left: auto;
  background: var(--cga-accent);
  color: #08131f;
  border: 1px solid var(--cga-accent);
  border-radius: 4px;
  padding: 3px 14px;
  font-weight: 700;
  cursor: pointer;
}
#cga-reload:hover {
  filter: brightness(1.15);
}
#cga-detail {
  min-height: 300px;
}

/* error state ----------------------------------------------------------- */
.cga-err {
  background: #2a1417;
  border: 1px solid var(--cga-bad);
  border-radius: 6px;
  padding: 8px 10px;
  color: #ffb3b3;
}

/* cgasi Findings view --------------------------------------------------- */
.cga-erc-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 0;
  color: var(--cga-dim);
  font-size: 11px;
}
.cga-erc {
  border: 1px solid var(--cga-line);
  border-radius: 3px;
  padding: 1px 8px;
  color: var(--cga-dim);
}
.cga-erc.active {
  background: var(--cga-accent);
  color: #08131f;
  border-color: var(--cga-accent);
  font-weight: 700;
}
.cga-erc-select {
  background: var(--cga-panel2);
  color: var(--cga-fg);
  border: 1px solid var(--cga-line);
  border-radius: 3px;
  padding: 1px 6px;
  font: inherit;
  font-size: 11px;
}
.cga-apply {
  background: var(--cga-accent);
  color: #08131f;
  border: 1px solid var(--cga-accent);
  border-radius: 3px;
  padding: 1px 12px;
  font-weight: 700;
  cursor: pointer;
}
.cga-apply:hover {
  filter: brightness(1.15);
}
tr.cga-filter-row td {
  padding: 2px 8px 6px;
  border-bottom: 1px solid var(--cga-line);
}
input.cga-filter {
  width: 100%;
  box-sizing: border-box;
  background: var(--cga-panel2);
  color: var(--cga-fg);
  border: 1px solid var(--cga-line);
  border-radius: 3px;
  padding: 2px 5px;
  font: inherit;
  font-size: 11px;
}
/* Findings can be long: give the table its own vertical scrollbar and keep the
   column headings + filter inputs pinned while the rows scroll. */
.cga-scroll {
  max-height: 60vh;
  overflow: auto;
  border: 1px solid var(--cga-line);
  border-radius: 4px;
}
.cga-scroll table.cga-list th {
  position: sticky;
  top: 0;
  background: var(--cga-panel);
  z-index: 2;
}
.cga-scroll tr.cga-filter-row td {
  position: sticky;
  top: 26px;
  background: var(--cga-panel);
  z-index: 1;
}

</style>

<style>
  .cga-replay-wrap {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .cga-replay-controls {
    position: sticky;
    top: 12px;
    flex: 0 0 178px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: calc(100vh - 24px);
    padding: 12px 10px;
    background: var(--cga-panel);
    border: 1px solid var(--cga-line);
    border-radius: 6px;
  }
  #cga-progress {
    writing-mode: vertical-lr;
    direction: ltr;
    width: 28px;
    height: 62vh;
    cursor: pointer;
    touch-action: none;
    accent-color: var(--cga-accent);
  }
  .cga-replay-count {
    color: var(--cga-accent);
    font-weight: 700;
  }
  .cga-replay-time,
  .cga-replay-label {
    width: 100%;
    color: var(--cga-dim);
    font-size: 11px;
    overflow-wrap: anywhere;
    text-align: center;
  }
  .cga-replay-label {
    color: var(--cga-fg);
  }
  .cga-replay-dashboard {
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 760px) {
    .cga-replay-controls {
      flex-basis: 118px;
    }
  }
</style>

</head>
<body>
<div class="cga-replay-wrap">

<aside class="cga-replay-controls">
  <div class="cga-replay-count" id="cga-progress-count">0 / 0</div>
  <input id="cga-progress" type="range" min="0" max="0" step="1" value="0"
    aria-label="Captured dashboard progress" />
  <div class="cga-replay-time" id="cga-progress-time">&mdash;</div>
  <div class="cga-replay-label" id="cga-progress-label">&mdash;</div>
</aside>

<main class="cga-replay-dashboard">
<!-- Row 1: header (cgasv/header) -->
    <div id="cga-header" class="cga-slot" data-comp="cgasv" data-route="/header"></div>

    <!-- Row 2: flow row -->
    <div id="cga-flow">
      <!-- left column: DB + query libraries -->
      <div class="cga-col cga-libs">
        <div class="cga-slot cga-box" data-comp="cgadl" data-route="/overview"></div>
        <div class="cga-slot cga-box" data-comp="cgaql" data-route="/overview"></div>
      </div>

      <div class="cga-arrow">&rarr;</div>

      <!-- flow boxes: requestor -> usrview -> sarif ingest -->
      <div class="cga-slot cga-box" data-comp="cgamr" data-route="/overview"></div>
      <div class="cga-arrow">&rarr;</div>
      <div class="cga-slot cga-box" data-comp="cgamu" data-route="/overview"></div>
      <div class="cga-arrow">&rarr;</div>
      <div class="cga-slot cga-box" data-comp="cgasi" data-route="/overview"></div>
    </div>

    <!-- Row 3: detail area (cga*/detail) -->
    <div id="cga-detail-bar">
      cga user view detail &mdash;
      <span id="cga-detail-which">cgamu</span>
      <span class="cga-hint">(click any box above to show its detail)</span>
      <button id="cga-reload" title="re-fetch all fragments">reload</button>
    </div>
    <div id="cga-detail" class="cga-slot"></div>
</main>
</div>

<script>
"use strict";

const SNAPSHOTS = window.CGA_DASHBOARD_SNAPSHOTS || [];
const OVERVIEWS = ["cgadl", "cgaql", "cgamr", "cgamu", "cgasi"];
let current = 0;
let selectedDetail = "cgamu";

const progress = document.getElementById("cga-progress");
const count = document.getElementById("cga-progress-count");
const time = document.getElementById("cga-progress-time");
const label = document.getElementById("cga-progress-label");
const detail = document.getElementById("cga-detail");

function fragment(snapshot, component, route) {
  const fragments = snapshot && snapshot.fragments;
  return fragments && fragments[component + "/" + route]
    ? fragments[component + "/" + route]
    : '<div class="cga-err">fragment missing from capture</div>';
}

function showDetail(component) {
  const snapshot = SNAPSHOTS[current] || {};
  selectedDetail = component;
  document.getElementById("cga-detail-which").textContent = component;
  detail.dataset.comp = component;
  detail.dataset.route = "/detail";
  detail.innerHTML = fragment(snapshot, component, "detail");
  detail.querySelectorAll(".cga-apply").forEach(function (button) {
    button.disabled = true;
    button.title = "Captured replay is read-only";
  });
}

function show(index) {
  if (!SNAPSHOTS.length) {
    count.textContent = "0 / 0";
    time.textContent = "\u2014";
    label.textContent = "No valid captures";
    return;
  }
  current = Math.max(0, Math.min(index, SNAPSHOTS.length - 1));
  const snapshot = SNAPSHOTS[current];
  progress.value = String(current);
  count.textContent = (current + 1) + " / " + SNAPSHOTS.length;
  time.textContent = snapshot.captured_at || "\u2014";
  label.textContent = snapshot.label || "\u2014";
  document.getElementById("cga-header").innerHTML =
    fragment(snapshot, "cgasv", "header");
  OVERVIEWS.forEach(function (component) {
    const slot = document.querySelector(
      '.cga-box[data-comp="' + component + '"]'
    );
    if (slot) slot.innerHTML = fragment(snapshot, component, "overview");
  });
  showDetail(selectedDetail);
}

function step(delta) {
  show(current + delta);
}

progress.min = "0";
progress.max = String(Math.max(0, SNAPSHOTS.length - 1));
progress.addEventListener("input", function () {
  show(parseInt(progress.value, 10) || 0);
});

  show(parseInt(progress.value, 10) || 0);
});

);

    return;

    case "ArrowRight":
    case "PageDown":

      event.preventDefault();
      break;

      show(0);
      event.preventDefault();
      break;

      show(SNAPSHOTS.length - 1);
      event.preventDefault();
      break;

});
