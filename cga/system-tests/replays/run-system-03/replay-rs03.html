<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MRVA sysview - replay</title>
<style>
  :root {
    --ink:#1b1f24; --muted:#57606a; --line:#d0d7de;
    --l-users:#f6f8fa; --l-user:#eef4ff; --l-sessions:#f1f8f2;
    --chip:#fff; --chip-hover:#0969da;
    --c-idle:#2da44e; --c-running:#0969da; --c-starting:#d4a72c;
    --c-stopping:#bc4c00; --c-exited:#8c959f; --c-down:#cf222e;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; color:var(--ink); background:#fff;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:18px; margin:0 0 2px; }
  h2 { font-size:15px; margin:22px 0 8px; }
  .sub { color:var(--muted); margin:0 0 6px; }
  #meta { color:var(--muted); font-size:12px; margin:0 0 14px; }
  #meta .err { color:var(--c-down); font-weight:600; }

  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  #pauseBtn { flex:none; cursor:pointer; font:600 13px/1 inherit; color:#fff;
    background:var(--c-running); border:1px solid rgba(0,0,0,.12); border-radius:6px;
    padding:8px 16px; }
  #pauseBtn:hover { filter:brightness(1.06); }
  #pauseBtn.paused { background:var(--c-starting); color:#3d2c00; }
  #meta .paused-tag { color:var(--c-stopping); font-weight:600; }

  /* --- user/session boxes (top) --- */
  .box { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
  .box .box-title { display:flex; align-items:center; gap:8px; cursor:pointer;
    user-select:none; font-weight:600; }
  .box .caret { transition:transform .12s; font-size:11px; color:var(--muted); }
  .box.collapsed > .box-title .caret { transform:rotate(-90deg); }
  .box.collapsed > :not(.box-title) { display:none; }
  .box .count { color:var(--muted); font-weight:400; font-size:12px; }
  .collapsed-hint { color:var(--muted); font-weight:400; font-size:12px; display:none; }
  .box.collapsed > .box-title .collapsed-hint { display:inline; }
  .level-users { background:var(--l-users); }
  .level-user { background:var(--l-user); }
  .level-sessions { background:var(--l-sessions); }

  .jobs-table-viewport { margin-top:6px; overflow:auto; width:664px; max-width:100%;
    max-height:136px; border:1px solid var(--line); border-radius:6px; background:var(--chip); }
  table.jobs { border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12px; }
  table.jobs th, table.jobs td { width:160px; min-width:160px; max-width:160px; height:34px;
    box-sizing:border-box; padding:6px 10px; border-right:1px solid var(--line);
    border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  table.jobs thead th { position:sticky; top:0; z-index:3; background:#eef1f5; color:var(--muted);
    text-transform:uppercase; letter-spacing:.02em; font-size:11px; }
  table.jobs th.col-repo, table.jobs td.col-repo { position:sticky; left:0; z-index:2;
    background:#f6f8fa; font-weight:600; }
  table.jobs thead th.col-repo { z-index:4; background:#e7ebf0; }
  table.jobs tbody tr:hover td { background:#eef4ff; }
  table.jobs tbody tr:hover td.col-repo { background:#dfe8ff; }
  table.jobs td.col-repo .pack-id { display:block; font-weight:400; font-size:11px;
    color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  /* Per-job progress indicator: pending > queued > in_progress > done squares.
     Same shape/size as the worker-pool swatch; only the active state is filled. */
  .statind { display:flex; gap:3px; margin-top:5px; }
  .statsq { width:12px; height:12px; border-radius:3px; border:1px solid var(--line);
    background:transparent; flex:0 0 auto; }
  .statsq.on { border-color:rgba(0,0,0,.25); }
  .statsq.on.p-pending { background:var(--c-exited); }
  .statsq.on.p-queued { background:var(--c-starting); }
  .statsq.on.p-inprogress { background:var(--c-running); }
  .statsq.on.p-ok { background:var(--c-idle); }
  .statsq.on.p-fail { background:var(--c-down); }

  /* --- worker grid (bottom) --- */
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin:0 0 12px; }
  .legend .item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.15); }
  .sw-idle{background:var(--c-idle)} .sw-running{background:var(--c-running)}
  .sw-starting{background:var(--c-starting)} .sw-stopping{background:var(--c-stopping)}
  .sw-exited{background:var(--c-exited)} .sw-down{background:var(--c-down)}
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-width:980px; }
  .cell { position:relative; border-radius:8px; padding:10px 12px; min-height:74px; color:#fff;
    border:1px solid rgba(0,0,0,.12); overflow:hidden; }
  .cell .st { position:relative; z-index:1; font-size:11px; text-transform:uppercase;
    letter-spacing:.03em; opacity:.9; }
  .cell .id { position:relative; z-index:1; font-weight:600; margin-top:2px; word-break:break-all; font-size:12px; }
  .cell .job { position:relative; z-index:1; margin-top:6px; font-size:12px; opacity:.95; }
  .cell .job.none { opacity:.6; font-style:italic; }
  .s-idle{background:var(--c-idle)} .s-running{background:var(--c-running)}
  .s-starting{background:var(--c-starting); color:#3d2c00} .s-stopping{background:var(--c-stopping)}
  .s-exited{background:var(--c-exited)} .s-down{background:var(--c-down)}
  .stale::after { content:""; position:absolute; inset:0; z-index:0;
    background:repeating-linear-gradient(45deg, rgba(207,34,46,0) 0 8px, rgba(207,34,46,.55) 8px 16px); }
  .cell .details { position:absolute; left:0; top:calc(100% + 6px); z-index:20; display:none;
    width:max-content; max-width:320px; background:#0d1117; color:#e6edf3; border-radius:6px;
    padding:10px 12px; box-shadow:0 6px 22px rgba(0,0,0,.30); font-size:12px; line-height:1.5; }
  .cell:hover .details { display:block; }
  .details dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  .details dt { color:#8b949e; } .details dd { margin:0; word-break:break-all; }
  .empty { color:var(--muted); font-style:italic; }
</style>
<style>
  .replay-wrap { display:flex; align-items:flex-start; gap:18px; }
  .slider-col { position:sticky; top:12px; flex:0 0 auto; display:flex;
    flex-direction:column; align-items:center; gap:10px; border:1px solid var(--line);
    border-radius:8px; padding:14px 12px; background:#f6f8fa; }
  .slider-col input[type=range] { writing-mode:vertical-lr; direction:ltr;
    width:26px; height:60vh; cursor:pointer; touch-action:none; accent-color:var(--c-running); }
  .slider-label { font-weight:600; font-size:13px; white-space:nowrap; }
  .slider-time { color:var(--muted); font-size:11px; text-align:center; white-space:nowrap; }
  .view-col { flex:1 1 auto; min-width:0; }
  #reloadBtn { flex:none; cursor:pointer; font:600 13px/1 inherit; color:#fff;
    background:var(--c-running); border:1px solid rgba(0,0,0,.12); border-radius:6px; padding:8px 16px; }
  #reloadBtn:hover { filter:brightness(1.06); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>MRVA sysview &mdash; replay</h1>
      <p class="sub">Offline replay of the sysview dump: drag the vertical slider, use the mouse wheel over it, or press Up/Down (Home/End) to scrub captured snapshots.</p>
    </div>
    <button id="reloadBtn" type="button" title="Re-read the dump file">Reload</button>
  </div>
  <div class="replay-wrap">
    <div class="slider-col">
      <div class="slider-label" id="idxLabel">0 / 0</div>
      <input id="idx" type="range" min="0" max="0" step="1" value="0" />
      <div class="slider-time" id="idxTime">&mdash;</div>
    </div>
    <div class="view-col">
      <div id="meta">loading&hellip;</div>
      <h2>Users, sessions &amp; jobs</h2>
      <div id="jobs"></div>
      <h2>Worker pool</h2>
      <div class="legend">
        <span class="item"><span class="swatch sw-starting"></span>starting</span>
        <span class="item"><span class="swatch sw-idle"></span>idle</span>
        <span class="item"><span class="swatch sw-running"></span>running</span>
        <span class="item"><span class="swatch sw-stopping"></span>stopping</span>
        <span class="item"><span class="swatch sw-down"></span>down (presumed/exited)</span>
        <span class="item"><span class="swatch sw-exited"></span>exited</span>
      </div>
      <div id="workers" class="grid"></div>
    </div>
  </div>

<script>
// Collapse state persists across refreshes (keyed by a stable per-box key).
var collapsed = new Set();
// Scroll offsets of session tables persist across refreshes, keyed by the
// same stable per-box key.
var scrollState = new Map();
var HEARTBEAT_EXPIRY_S = 120;

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

// Collapsible titled box. key must be stable across refreshes.
function box(levelClass, key, labelHtml) {
  var b = el("div", "box " + levelClass);
  b.dataset.key = key;
  if (collapsed.has(key)) b.classList.add("collapsed");
  var t = el("div", "box-title");
  var caret = el("span", "caret", "\u25BE");
  var label = el("span", "box-label");
  label.innerHTML = labelHtml;
  var hint = el("span", "collapsed-hint", "(collapsed)");
  t.appendChild(caret); t.appendChild(label); t.appendChild(hint);
  t.addEventListener("click", function () {
    if (b.classList.toggle("collapsed")) collapsed.add(key); else collapsed.delete(key);
  });
  b.appendChild(t);
  return b;
}

function esc(s) { return String(s == null ? "" : s); }

// ---- Jobs section: users -> user -> sessions(table) ----
function group(rows) {
  var users = new Map();
  rows.forEach(function (r) {
    if (!users.has(r.user)) users.set(r.user, new Map());
    var sessions = users.get(r.user);
    if (!sessions.has(r.session_id)) sessions.set(r.session_id, []);
    sessions.get(r.session_id).push(r);
  });
  return users;
}

function jobLabel(r) { return r.owner + "/" + r.repo; }

// jobStatusName maps a common.Status code to its label. -1 means no status row.
function jobStatusName(s) {
  switch (s) {
    case 0: return "pending";
    case 1: return "in_progress";
    case 2: return "succeeded";
    case 3: return "failed";
    case 4: return "canceled";
    case 5: return "timed_out";
    case 6: return "queued";
    default: return "unknown";
  }
}

// statusIndicator renders the left-to-right progress squares:
//   [pending] [queued] [in_progress] [succeeded|failed]
// Only the active state's square is filled (outline-only otherwise); the last
// square is green on success, red on failure/cancel/timeout. Shape, size and
// colors mirror the worker-pool swatches where the states correspond.
function statusIndicator(status) {
  var active = -1, termCls = "p-ok";
  switch (status) {
    case 0: active = 0; break;                     // pending
    case 6: active = 1; break;                     // queued
    case 1: active = 2; break;                     // in_progress
    case 2: active = 3; termCls = "p-ok"; break;   // succeeded
    case 3: active = 3; termCls = "p-fail"; break; // failed
    case 4: active = 3; termCls = "p-fail"; break; // canceled
    case 5: active = 3; termCls = "p-fail"; break; // timed_out
    default: active = -1;                          // unknown / no status row
  }
  var fills = ["p-pending", "p-queued", "p-inprogress", termCls];
  var ind = el("div", "statind");
  for (var i = 0; i < 4; i++) {
    var sq = el("div", "statsq");
    if (i === active) { sq.classList.add("on"); sq.classList.add(fills[i]); }
    ind.appendChild(sq);
  }
  ind.title = "status: " + jobStatusName(status);
  return ind;
}

// packLabel returns "pack-<sha1>" for the session, using the query pack SHA1
// shared by all its jobs. Falls back to "pack-(unknown)" if no hash is present.
function packLabel(jobs) {
  for (var i = 0; i < jobs.length; i++) {
    if (jobs[i] && jobs[i].pack_sha1) return "pack-" + jobs[i].pack_sha1;
  }
  return "pack-(unknown)";
}

function jobTitle(r) {
  return [
    "owner:     " + esc(r.owner),
    "repo:      " + esc(r.repo),
    "user:      " + esc(r.user),
    "session:   " + esc(r.session_id),
    "status:    " + esc(jobStatusName(r.status)),
    "started:   " + (r.started_at || "\u2014"),
    "completed: " + (r.completed_at || "\u2014"),
    "worker:    " + (r.worker_id || "\u2014"),
    "argo wf:   " + (r.argo_workflow_id || "\u2014")
  ].join("\n");
}

function sessionsTable(sessions, scrollKey) {
  var vp = el("div", "jobs-table-viewport");
  vp.dataset.scrollkey = scrollKey;
  vp.addEventListener("scroll", function () {
    scrollState.set(scrollKey, { left: vp.scrollLeft, top: vp.scrollTop });
  });
  var table = el("table", "jobs");
  var maxJobs = 0;
  sessions.forEach(function (jobs) { if (jobs.length > maxJobs) maxJobs = jobs.length; });

  var thead = el("thead"), htr = el("tr");
  htr.appendChild(el("th", "col-repo", "session"));
  for (var i = 0; i < maxJobs; i++) htr.appendChild(el("th", null, "job " + (i + 1)));
  thead.appendChild(htr); table.appendChild(thead);

  var tbody = el("tbody");
  sessions.forEach(function (jobs, sid) {
    var tr = el("tr");
    var sc = el("td", "col-repo", String(sid));
    var pack = packLabel(jobs);
    sc.appendChild(el("span", "pack-id", pack));
    sc.title = "session " + sid + " (" + jobs.length + " jobs)\n" + pack;
    tr.appendChild(sc);
    for (var i = 0; i < maxJobs; i++) {
      var r = jobs[i];
      var td = el("td", null, null);
      if (r) {
        td.appendChild(el("div", "job-repo", jobLabel(r)));
        td.appendChild(statusIndicator(r.status));
        td.title = jobTitle(r);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  vp.appendChild(table);
  return vp;
}

function renderJobs(rows) {
  var host = document.getElementById("jobs");
  host.innerHTML = "";
  if (!rows || !rows.length) { host.appendChild(el("div", "empty", "no jobs")); return; }
  var users = group(rows);
  var usersBox = box("level-users", "users",
    "users <span class=\"count\">(" + users.size + ")</span>");
  users.forEach(function (sessions, userName) {
    var userJobs = 0; sessions.forEach(function (js) { userJobs += js.length; });
    var userBox = box("level-user", "user:" + userName,
      "<span class=\"user-name\">user: " + esc(userName) + "</span> " +
      "<span class=\"count\">(" + userJobs + " job" + (userJobs === 1 ? "" : "s") + ")</span>");
    var sessionsBox = box("level-sessions", "sessions:" + userName,
      "sessions <span class=\"count\">(" + sessions.size + ")</span>");
    sessionsBox.appendChild(sessionsTable(sessions, "sessions:" + userName));
    userBox.appendChild(sessionsBox);
    usersBox.appendChild(userBox);
  });
  host.appendChild(usersBox);
  // Restore each table's scroll offset after the rebuild (innerHTML wipe
  // above discards the live scroll position).
  host.querySelectorAll(".jobs-table-viewport").forEach(function (vp) {
    var s = scrollState.get(vp.dataset.scrollkey);
    if (s) { vp.scrollLeft = s.left; vp.scrollTop = s.top; }
  });
}

// ---- Worker section: grid ----
function classify(w) {
  var stale = (w.status === 0 || w.status === 1) && w.hb_age_s > HEARTBEAT_EXPIRY_S;
  if (w.status === 3) return { label: "down (exited)", cls: "s-exited", stale: false };
  if (stale)          return { label: "down (presumed)", cls: "s-down", stale: true };
  if (w.status === 2) return { label: "stopping", cls: "s-stopping", stale: false };
  if (w.status === 1) return { label: "running", cls: "s-running", stale: false };
  return                     { label: "idle", cls: "s-idle", stale: false };
}
function drow(dl, k, v) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); }

function workerCell(w) {
  var s = classify(w);
  var cell = el("div", "cell " + s.cls + (s.stale ? " stale" : ""));
  cell.appendChild(el("div", "st", s.label));
  cell.appendChild(el("div", "id", w.worker_id));
  if (w.current_job) cell.appendChild(el("div", "job", "job: " + w.current_job));
  else cell.appendChild(el("div", "job none", "no job"));
  var details = el("div", "details"), dl = el("dl");
  drow(dl, "worker", w.worker_id);
  drow(dl, "state", s.label);
  drow(dl, "current job", w.current_job || "\u2014");
  drow(dl, "user", w.user_id || "\u2014");
  drow(dl, "completed", String(w.jobs_completed));
  drow(dl, "heartbeat", w.hb_age_s + "s ago" + (s.stale ? "  (STALE)" : ""));
  drow(dl, "pod", w.argo_pod_name || "\u2014");
  details.appendChild(dl); cell.appendChild(details);
  return cell;
}
function spawnCell(sp) {
  var cell = el("div", "cell s-starting");
  cell.appendChild(el("div", "st", "starting"));
  cell.appendChild(el("div", "id", "(registering\u2026)"));
  cell.appendChild(el("div", "job none", sp.language_hint || "worker"));
  var details = el("div", "details"), dl = el("dl");
  drow(dl, "state", "starting (pending spawn)");
  drow(dl, "workflow", sp.workflow_uid);
  drow(dl, "language", sp.language_hint || "\u2014");
  drow(dl, "spawned", sp.age_s + "s ago");
  details.appendChild(dl); cell.appendChild(details);
  return cell;
}
function renderWorkers(workers, spawns) {
  var host = document.getElementById("workers");
  host.innerHTML = "";
  (spawns || []).forEach(function (sp) { host.appendChild(spawnCell(sp)); });
  (workers || []).forEach(function (w) { host.appendChild(workerCell(w)); });
  if (!host.children.length) host.appendChild(el("div", "empty", "no workers"));
}

function render(data) {
  if (typeof data.heartbeat_expiry_s === "number") HEARTBEAT_EXPIRY_S = data.heartbeat_expiry_s;
  var meta = document.getElementById("meta");
  meta.textContent = "updated " + (data.generated_at || "?") +
    "  \u00b7  refresh " + (data.refresh_ms / 1000) + "s" +
    "  \u00b7  " + (data.jobs ? data.jobs.length : 0) + " jobs, " +
    (data.workers ? data.workers.length : 0) + " workers, " +
    (data.spawns ? data.spawns.length : 0) + " starting";
  if (data.error) {
    var e = el("span", "err", "  \u00b7  error: " + data.error);
    meta.appendChild(e);
  }
  renderJobs(data.jobs || []);
  renderWorkers(data.workers || [], data.spawns || []);
}

var SNAPS = [];
var cur = 0;
var idxEl = document.getElementById("idx");
var idxLabel = document.getElementById("idxLabel");
var idxTime = document.getElementById("idxTime");

function show(i) {
  if (!SNAPS.length) {
    render({ jobs: [], workers: [], spawns: [], generated_at: "\u2014", refresh_ms: 0 });
    idxLabel.textContent = "0 / 0";
    idxTime.textContent = "\u2014";
    return;
  }
  if (i < 0) i = 0;
  if (i > SNAPS.length - 1) i = SNAPS.length - 1;
  cur = i;
  idxEl.value = String(i);
  idxLabel.textContent = (i + 1) + " / " + SNAPS.length;
  var s = SNAPS[i] || {};
  idxTime.textContent = s.generated_at ? s.generated_at : "\u2014";
  render(s);
}

function load() {
  // Self-contained export path: data is baked into the page, no server needed.
  if (Array.isArray(window.SNAPS_EMBEDDED)) {
    SNAPS = window.SNAPS_EMBEDDED;
    idxEl.min = "0";
    idxEl.max = String(Math.max(0, SNAPS.length - 1));
    if (cur > SNAPS.length - 1) cur = SNAPS.length - 1;
    if (cur < 0) cur = 0;
    show(cur);
    return;
  }
  fetch("snapshots", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (arr) {
      SNAPS = Array.isArray(arr) ? arr : [];
      idxEl.min = "0";
      idxEl.max = String(Math.max(0, SNAPS.length - 1));
      if (cur > SNAPS.length - 1) cur = SNAPS.length - 1;
      if (cur < 0) cur = 0;
      show(cur);
    })
    .catch(function (err) {
      document.getElementById("meta").textContent = "load error: " + err;
    });
}

function step(delta) { show(cur + delta); }

// A single "input" listener keeps the model in sync with native drag/click on
// the range. "change" is a backstop for browsers that only emit it on release.
function onSlider() { show(parseInt(idxEl.value, 10) || 0); }
idxEl.addEventListener("input", onSlider);
idxEl.addEventListener("change", onSlider);

document.getElementById("reloadBtn").addEventListener("click", load);

// Keyboard: handle globally and always preventDefault so the behaviour is the
// same whether or not the range has focus. Calling preventDefault here also
// cancels the native range key handling, so there is never a double/opposite
// step (the source of the earlier inconsistent-scroll behaviour).
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA") && t !== idxEl) return;
  switch (e.key) {
    case "ArrowUp": case "ArrowLeft": case "PageUp": step(-1); e.preventDefault(); break;
    case "ArrowDown": case "ArrowRight": case "PageDown": step(1); e.preventDefault(); break;
    case "Home": show(0); e.preventDefault(); break;
    case "End": show(SNAPS.length - 1); e.preventDefault(); break;
  }
});

// Mouse wheel over the slider column is a reliable alternative to dragging the
// (CSS-vertical) range thumb, which some browsers map inconsistently.
var sliderCol = document.querySelector(".slider-col");
if (sliderCol) {
  sliderCol.addEventListener("wheel", function (e) {
    step(e.deltaY > 0 ? 1 : -1);
    e.preventDefault();
  }, { passive: false });
}

load();
</script>
</body>
</html>
